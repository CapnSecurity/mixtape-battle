name: Build and Deploy

# DISABLED - Using Render auto-deploy instead
# Render automatically deploys when changes are pushed to main
on:
  workflow_dispatch: # Manual trigger only if needed

jobs:
  build-verify:
    name: Verify Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verification only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mixtape-battle-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "## ✅ Build Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker image built successfully." >> $GITHUB_STEP_SUMMARY
          echo "Deployment will proceed on self-hosted runner..." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build-verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Pre-deployment validation
        shell: pwsh
        run: |
          Write-Host "🔍 Running pre-deployment validation..."
          Set-Location "C:\Users\tim\Desktop\Windsurf Projects\mixtape-battle"
          git fetch origin
          git reset --hard origin/main
          $env:CI = "true"
          .\scripts\pre-deploy-check.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Validation failed! Aborting deployment." -ForegroundColor Red
            exit 1
          }
          
      - name: Deploy to production
        shell: pwsh
        run: |
          Write-Host "🚀 Deploying to production..."
          Set-Location "C:\Users\tim\Desktop\Windsurf Projects\mixtape-battle"
          .\deploy.ps1
          
      - name: Verify deployment
        shell: pwsh
        run: |
          Write-Host "🔍 Verifying deployment..."
          Start-Sleep -Seconds 5
          try {
            $response = Invoke-WebRequest -Uri "http://localhost" -UseBasicParsing -SkipCertificateCheck -TimeoutSec 10
            if ($response.StatusCode -eq 200) {
              Write-Host "✅ Deployment verified - application is healthy" -ForegroundColor Green
            }
          } catch {
            Write-Host "⚠️  Health check failed: $_" -ForegroundColor Yellow
            exit 1
          }
          
      - name: Deployment Summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## ✅ Pre-deployment Validation Passed"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "All route references verified and validated."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## 🚀 Deployment Complete"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Production has been updated with commit ``${{ github.sha }}``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Branch:** ``${{ github.ref_name }}``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Commit:** ``${{ github.sha }}``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**Triggered by:** ${{ github.actor }}"
