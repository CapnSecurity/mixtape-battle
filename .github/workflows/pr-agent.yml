name: AI review (PR-Agent)

# ADVISORY ONLY and DISABLED BY DEFAULT.
#
# This job does nothing until the repository variable ENABLE_PR_AGENT is set to "true" AND an LLM
# API key is added as the secret OPENAI_KEY (see docs/CI-AND-REVIEW.md for cost and data-handling
# notes). Enabling it sends pull-request diffs to the configured model provider.
#
# Safety properties:
#  - Triggered by `pull_request` (never `pull_request_target`): fork PRs get no secrets and are skipped.
#  - Does not check out or execute pull-request code; it reads the PR through the GitHub API.
#  - Token can only comment (pull-requests: write, issues: write); it has no contents:write and no
#    deployment permissions. Auto-approval is disabled in .pr_agent.toml, and "Allow GitHub Actions to
#    create and approve pull requests" must stay OFF in repository settings.
#  - Its result is not part of the "All required checks" gate in pr-checks.yml.
#  - Slash commands from comments are limited to repository owners/members/collaborators.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent:
    name: PR-Agent review (advisory)
    if: >-
      ${{ vars.ENABLE_PR_AGENT == 'true'
      && github.event.sender.type != 'Bot'
      && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'issue_comment' && github.event.issue.pull_request
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: PR-Agent
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Review only; descriptions and code suggestions cost more tokens and stay off for now.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
